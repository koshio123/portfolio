<!-- @dsCard group="Actions" height=200 subtitle="Day / Night" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.zone{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);padding:var(--space-6);background:var(--bg)}
.btn{display:inline-flex;align-items:center;min-height:var(--touch-target);padding:0 var(--space-6);border-radius:var(--radius-md);font:inherit;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.primary{background:var(--primary-bg);color:var(--primary-ink);border:none}
.secondary{background:transparent;color:var(--ink);border:var(--border-width) solid var(--line-strong)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lbl{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;color:var(--ink-muted);width:100%}
</style>
</head>
<body>
<div class="zone"><span class="lbl">DAY</span><a class="btn primary" href="#">職務経歴書をダウンロード</a><button class="btn secondary" type="button">プロジェクトを見る</button></div>
<div class="zone" data-theme="night"><span class="lbl">NIGHT</span><a class="btn primary" href="#">プロジェクトを見る</a><button class="btn secondary" type="button">スキップ →</button></div>
</body>
</html>
