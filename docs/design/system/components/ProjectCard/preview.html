<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:var(--font-sans);background:var(--bg);padding:var(--space-6)}
.card{display:flex;flex-direction:column;max-width:360px;border:var(--border-width) solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--bg);color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--line-strong)}
.fig{height:160px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:var(--space-2);font-size:12px}
.box{padding:var(--space-2) var(--space-3);background:var(--bg);border:var(--border-width) solid var(--line-strong);border-radius:var(--radius-sm);color:var(--ink)}
.main{background:var(--night-box);border-color:var(--night-box);color:var(--accent-cyan);font-weight:700}
.arr{color:var(--ink-muted)}
.body{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-2)}
.tag{align-self:flex-start;font-size:12px;padding:2px var(--space-3);border-radius:var(--radius-pill);background:var(--accent-amber);color:var(--on-accent)}
.title{font-size:20px;line-height:1.5;font-weight:700}
.sum{font-size:14px;line-height:1.7;color:var(--ink-muted)}
.chips{display:flex;flex-wrap:wrap;gap:var(--space-2);font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
</style>
</head>
<body>
<a class="card" href="#">
<div class="fig"><span class="box">車両</span><span class="arr">→</span><span class="box">ゲートウェイ</span><span class="arr">→</span><span class="box main">クラウド</span></div>
<div class="body">
<span class="tag">業務</span>
<span class="title">V2X(EVスマート充電)</span>
<span class="sum">[概要:何を、誰のために作ったか]</span>
<div class="chips"><span>AWS</span><span>FastAPI</span><span>PostgreSQL</span></div>
</div>
</a>
</body>
</html>
