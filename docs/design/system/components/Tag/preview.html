<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center;padding:var(--space-4) var(--space-6);background:var(--bg)}
.tag{font-size:12px;line-height:1.6;padding:2px var(--space-3);border-radius:var(--radius-pill)}
.work{background:var(--accent-amber);color:var(--on-accent)}
.personal{background:var(--tag-personal-bg);color:var(--tag-personal-ink)}
.chip{font-family:var(--font-mono);font-size:12px;color:var(--ink);padding:4px 10px;border:var(--border-width) solid var(--line-strong);border-radius:var(--radius-sm)}
</style>
</head>
<body>
<div class="row"><span class="tag work">業務</span><span class="tag personal">個人開発</span></div>
<div class="row"><span class="chip">Python</span><span class="chip">FastAPI</span><span class="chip">PostgreSQL</span><span class="chip">AWS</span></div>
</body>
</html>
